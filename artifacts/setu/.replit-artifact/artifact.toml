kind = "web"
previewPath = "/"
title = "Setu — Indian Sign Language Bridge"
description = "An Indian Sign Language communication bridge for staff and clients, with sign capture, spoken languages, phrase libraries, transcripts, and device readiness checks."
version = "1.0.0"
id = "artifacts/setu"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22866

[services.development]
run = "pnpm --filter @workspace/setu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/setu", "run", "build" ]
serve = "static"
publicDir = "artifacts/setu/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22866"
BASE_PATH = "/"
