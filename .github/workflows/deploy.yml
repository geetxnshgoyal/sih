# Build the app and publish it to GitHub Pages.
#
# Why this exists: the demo needs a URL people can open from any device. A LAN
# address only works on one network, and the camera path needs HTTPS anyway , 
# Pages gives both for free.
#
# The trained model (2.1 MB) is committed, so the build needs no dataset, no
# training step and no secrets.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      # DEPLOY_BASE must match the repo name: Pages serves the site from
      # https://<user>.github.io/<repo>/, and assets resolve against it.
      - run: npm run build
        env:
          DEPLOY_BASE: /${{ github.event.repository.name }}/
      # SPA fallback: Pages has no rewrite rules, so a deep link would 404.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
